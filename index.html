<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tu cm digital</title>
<meta name="description" content="Portal de tu community manager: revisá y aprobá tu semana de Instagram, mandá fotos y escribinos.">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tu cm digital">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F2;--card:#FFFFFF;--tx:#161616;--tx2:#5C5A57;--tx3:#8C8985;--line:#E7E3DE;--brand:#161616;--acc:#D9480F;--acc-bg:#FFEDE2;--naranja:#FF6B1A;--on-acc:#FFFFFF;
--ok:#137A4B;--ok-bg:#E3F5EC;--warn:#9A5B00;--warn-bg:#FFF2DB;--bad:#B4232C;--bad-bg:#FDE8E9;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1C1C1C;--tx:#F2F0ED;--tx2:#B3AFA9;--tx3:#85817C;--line:#2E2C2A;--brand:#F2F0ED;--acc:#FF7A33;--acc-bg:#33200F;--on-acc:#161616;
--ok:#5FD39A;--ok-bg:#12291F;--warn:#F0B35A;--warn-bg:#2E2412;--bad:#FF7A80;--bad-bg:#331518}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{min-height:100vh;display:flex}
/* nav */
.side{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx3);padding:4px 10px;border-radius:10px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}
.dot{position:absolute;top:2px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
main{flex:1;min-width:0;padding:20px 16px 96px;max-width:1120px;margin:0 auto}
header.top .cerrar{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-size:18px;display:flex;align-items:center;justify-content:center}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hi{font-size:13px;color:var(--tx2)}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;font-weight:600;margin:22px 0 10px}
.sub{color:var(--tx2);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-rev{background:var(--warn-bg);color:var(--warn)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-cam{background:var(--acc-bg);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.prev{aspect-ratio:4/5;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;position:relative}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.prev.hist{aspect-ratio:9/16}
.multi{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.nav-img{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;font-size:18px;display:flex;align-items:center;justify-content:center}
.body{padding:14px 16px 16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin-bottom:6px}
.tit{font-weight:600;font-size:16px;margin-bottom:6px}
.cap{font-size:14px;color:var(--tx2);white-space:pre-wrap;max-height:4.5em;overflow:hidden;position:relative}
.cap.open{max-height:none}
.more{font-size:13px;color:var(--acc);font-weight:500;margin-top:4px}
.stk{font-size:13px;background:var(--acc-bg);color:var(--acc);padding:8px 10px;border-radius:10px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card);text-align:center}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);resize:vertical;min-height:52px}
textarea:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px}
.coment{margin-top:10px;display:none}.coment.on{display:block}
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
.empty svg{width:48px;height:48px;color:var(--tx3);margin-bottom:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--tx2);background:var(--card);display:block;cursor:pointer}
.drop:hover{border-color:var(--acc)}
.drop svg{width:34px;height:34px;color:var(--acc)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;width:90px}.bar i{display:block;height:100%;background:var(--acc);width:0}
.btn:disabled{opacity:.4;cursor:default}
.drv{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:inherit;text-decoration:none}.drv img{display:block}.adj-v .drv{display:inline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;opacity:0;transition:opacity .15s}.modal.on{opacity:1}
.modal-c{background:var(--card);color:var(--tx);border-radius:18px;padding:22px 20px 16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(8px);transition:transform .15s}.modal.on .modal-c{transform:none}
.modal-c h3{font-size:18px;font-weight:700;margin-bottom:6px}.modal-c p{color:var(--tx2);font-size:15px;margin-bottom:16px}
.modal-b{display:flex;gap:8px}.modal-b .btn{flex:1}.btn.peligro{background:var(--bad);border-color:var(--bad);color:#fff}
.ayuda{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-weight:700;font-size:16px}
.guia{position:relative;text-align:center;padding-top:28px}.guia p{text-align:center}.g-ic{font-size:40px;line-height:1;margin-bottom:12px;color:var(--acc);display:flex;justify-content:center}.g-ic svg{width:44px;height:44px}
.g-skip{position:absolute;top:12px;right:14px;font-size:13px;color:var(--tx3)}.g-dots{display:flex;gap:6px;justify-content:center;margin:-4px 0 16px}.g-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.g-dots i.on{background:var(--acc);width:18px;border-radius:4px}
.semnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px}.semnav .btn{flex:0 0 auto}
.descartar{display:block;margin-top:8px;font-size:13px;color:var(--tx3);text-decoration:underline}.pz-no{color:var(--tx3)}
.pz-ok{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;font-size:13px;color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.adj{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.adj-i{width:84px;height:84px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:20px}.adj-i img{width:100%;height:100%;object-fit:cover}
.adj-v{font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.08)}
.pz{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden;color:var(--tx);white-space:normal}
.pz-imgs{display:flex;gap:4px;overflow-x:auto;background:var(--line)}.adj-i.grande{width:220px;height:auto;min-height:120px;border-radius:0;flex:0 0 auto}.adj-i.grande img{height:auto}
.pz-b{padding:10px 12px}.pz .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--tx2);align-items:center}.pz .tit{font-weight:600;margin:4px 0}
.pz .coment{display:none;margin-top:8px}.pz .coment.on{display:block}.pz textarea{width:100%;min-height:60px}
.tray{display:flex;flex-wrap:wrap;gap:6px}.tray:empty{display:none}.chip-a{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;display:inline-flex;align-items:center;gap:4px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip-a button{color:var(--tx3);font-size:12px;padding:0 4px}
.row-send{display:flex;gap:8px;align-items:flex-end;width:100%}.clip{font-size:22px;cursor:pointer;padding:6px 4px;line-height:1}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.cm{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.cliente{background:var(--brand);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.65;margin-top:4px}
.send{display:flex;flex-direction:column;gap:6px;align-items:stretch;position:sticky;bottom:84px;background:var(--bg);padding-top:8px}
.send textarea{min-height:48px}
.send .btn{flex:0 0 auto}
.resp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}.rq{font-size:13px;color:var(--tx2);margin-bottom:4px}.ra{white-space:pre-wrap}.ra.vacia{color:var(--tx3);font-style:italic}
.mini{font-size:14px;font-weight:600;color:var(--tx2);margin:18px 0 8px}.nota{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}.nt{white-space:pre-wrap}.nf{font-size:12px;color:var(--tx3);margin-top:4px}.ok-t{color:var(--ok)}
.chips{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-size:14px;font-weight:500}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.b-no{background:var(--line);color:var(--tx2)}
.ag{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ag details>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}.ag summary::-webkit-details-marker{display:none}
.ag .ti{font-size:22px}.ag .tx{flex:1;min-width:0;display:flex;flex-direction:column}.ag .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ag .tx small{color:var(--tx3);font-size:13px}
.ag-body{padding:0 14px 14px}.pub{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--tx2)}.pub span{flex:1}.pub .btn{flex:0 0 auto;padding:6px 16px}.ag-img img{width:100%;max-width:360px;border-radius:10px;display:block;margin-bottom:10px}.ag-img{color:var(--tx3);font-size:13px}
.q{margin-bottom:16px}.q label{display:block;font-weight:500;margin-bottom:6px}.q small{color:var(--tx3)}
.steps{display:flex;gap:6px;margin:10px 0 18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.skel{height:220px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.marca{font-family:Outfit,Inter,sans-serif;font-size:24px;letter-spacing:-.5px;line-height:1;color:var(--tx);white-space:nowrap}.marca span{font-weight:300}.marca b{font-weight:800;color:var(--naranja)}
.mlogo{margin-bottom:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* compu */
@media (min-width:900px){
  .bottom{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:240px;flex:0 0 240px;padding:24px 14px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh}
  .side .logo{padding:4px 12px 22px}
  .mlogo{display:none}
  .side .tab{flex-direction:row;font-size:15px;gap:12px;padding:10px 12px;color:var(--tx2);justify-content:flex-start}
  .side .tab.on{background:var(--acc-bg);color:var(--acc)}
  .side .dot{position:static;margin-left:auto}
  main{padding:32px 40px 48px}
  h1{font-size:30px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .send{bottom:0;padding-bottom:16px}
  .toast{bottom:28px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Secciones"></nav>
  <main id="main"><div class="skel"></div></main>
</div>
<nav class="bottom" id="bottom" aria-label="Secciones"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyGJnJGTpics16rlhOZkRXrKDyzGvFZeO5peSJlI6ITBHwW8QCdMuSNoPHUCQV1MMXMJw/exec';
var MAX_MB = 45;
var ICON = {
  semana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  material:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.5-2h6l1.5 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>',
  mensajes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>',
  datos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  alta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2 8 12.7 4 8.8l5.5-.8z"/></svg>',
  subir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  vacio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M9 15h6"/></svg>'
};
var PREGUNTAS_BASE = [
  {id:'que_hacen', texto:'¿Qué hacen y qué los diferencia?', ayuda:'En 2 o 3 líneas.'},
  {id:'productos', texto:'¿Cuáles son sus productos o servicios principales?'},
  {id:'publico', texto:'¿A quién le quieren llegar?', ayuda:'Tipo de cliente, zona.'},
  {id:'objetivo', texto:'¿Qué quieren lograr con Instagram?', ayuda:'Consultas, ventas, turnos, que los conozcan…'},
  {id:'tono', texto:'¿Cómo le hablan a sus clientes?', ayuda:'De vos o de usted, formal o cercano, con o sin emojis.'},
  {id:'nunca', texto:'¿Hay algo que NUNCA quieran que se publique?', ayuda:'Precios, ciertos temas, palabras.'},
  {id:'referencias', texto:'Cuentas de Instagram que les gusten', ayuda:'De cualquier rubro.'},
  {id:'colores', texto:'Colores de la marca', ayuda:'Si no los saben, los sacamos del logo.'},
  {id:'contacto', texto:'Contacto que se puede publicar', ayuda:'WhatsApp o teléfonos (con nombre), dirección, link de Google Maps, horario, web.'},
  {id:'equipo', texto:'¿Quién nos pasa la info cada semana y quién aprueba?'},
  {id:'ritmo', texto:'¿Cuántas publicaciones por semana y qué días/horarios?', ayuda:'Sugerencia: 2 posts, 1 reel y 3 historias.'},
  {id:'dia_material', texto:'¿Qué día te queda cómodo pasarnos la info y las fotos? ¿Desde qué día arranca cada semana?', ayuda:'Ese día te mandamos un recordatorio. Ej.: "los viernes, y que la semana arranque el lunes".'},
  {id:'publicacion', texto:'¿Se publica solo después de aprobar, o prefieren recibir las piezas y programarlas ustedes?'},
  {id:'aclaraciones', opcional:true, texto:'¿Algo más que quieras aclarar? (opcional)', ayuda:'Cómo te gustaría que se vean o qué evitar. Ej.: "que las historias no sean todas iguales, que varíen los colores", "más fotos y menos texto".'}
];

var S = {clave:'', datos:null, tab:'mensajes', demo:false, subiendo:{}};
function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2600)}
function fecha(iso){try{return new Date(iso).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function guardarLocal(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function leerLocal(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}

// ---------- API ----------
function get(params){
  if(S.demo) return Promise.resolve(DEMO.get(params));
  var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  return fetch(API+'?clave='+encodeURIComponent(S.clave)+'&'+q+'&_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()});
}
function post(obj){
  if(S.demo) return Promise.resolve(DEMO.post(obj));
  obj.clave=S.clave;
  return fetch(API,{method:'POST',body:JSON.stringify(obj)}).then(function(r){return r.json()});
}

// ---------- arranque ----------
function entrarConLink(){
  var v=$('lnk').value.trim(), m=v.match(/[?&]c=([^&#\s]+)/);
  if(!m){ $('lnkErr').textContent='Ese link no parece el de tu portal. Copialo entero desde el mail.'; return; }
  var c=decodeURIComponent(m[1]); guardarLocal('cm_clave',c); location.replace(location.pathname+'?c='+encodeURIComponent(c));
}
function init(){
  var p=new URLSearchParams(location.search);
  S.demo=p.get('demo')==='1';
  S.clave=p.get('c')||leerLocal('cm_clave');
  if(p.get('c')) guardarLocal('cm_clave',p.get('c'));
  // que la dirección siempre lleve la clave: así "Agregar a inicio" guarda el acceso directo a SU portal
  if(S.clave && !p.get('c') && !S.demo){ try{ history.replaceState(null,'',location.pathname+'?c='+encodeURIComponent(S.clave)); }catch(e){} }
  if(!S.clave && !S.demo){ $('main').innerHTML='<div class="empty">'+ICON.vacio+'<h1>Hola 👋</h1><p class="sub" style="margin-top:6px">Para entrar, abrí el link personal que te mandamos por mail.</p>'

function todasPiezas(){ return (S.datos.historial_semanas||[]).concat(S.datos.semana?[S.datos.semana]:[]); }
function piezaPorId(id){ var sems=todasPiezas(); for(var i=sems.length-1;i>=0;i--){ var p=(sems[i].piezas||[]).filter(function(x){return x.id===id})[0]; if(p) return p; } return null; }
function lineaTiempo(){
  var l=[], usados={};
  (S.datos.mensajes||[]).forEach(function(m){ l.push({t:m.fecha,m:m}); (m.adjuntos||[]).forEach(function(a){usados[a.id]=1}); });
  (S.datos.notas||[]).forEach(function(n){ l.push({t:n.fecha,m:{de:'cliente',texto:n.texto,fecha:n.fecha}}); });
  (S.datos.feedback||[]).forEach(function(f){ l.push({t:f.fecha,fb:f}); });
  var grupo=null;   // material subido por fuera del chat (versiones anteriores): se agrupa
  (S.datos.material||[]).filter(function(a){return a.id&&!usados[a.id]&&a.para!=='logo'}).forEach(function(a){
    if(grupo && new Date(a.fecha)-new Date(grupo.t)<10*60000){ grupo.m.adjuntos.push(a); return; }
    grupo={t:a.fecha,m:{de:'cliente',texto:'',fecha:a.fecha,adjuntos:[a]}}; l.push(grupo);
  });
  return l.sort(function(a,b){return String(a.t).localeCompare(String(b.t))});
}

// Ventana de confirmación propia (en lugar del cartel del navegador)
function preguntar_(titulo,texto,si,no,peligro){
  return new Promise(function(res){
    var d=document.createElement('div'); d.className='modal';
    d.innerHTML='<div class="modal-c" role="alertdialog" aria-modal="true" aria-labelledby="mdT"><h3 id="mdT">'+esc(titulo)+'</h3>'+(texto?'<p>'+esc(texto)+'</p>':'')
      +'<div class="modal-b"><button class="btn" data-r="0">'+esc(no||'Cancelar')+'</button><button class="btn '+(peligro?'peligro':'pri')+'" data-r="1">'+esc(si||'Aceptar')+'</button></div></div>';
    var cerrar=function(v){ document.removeEventListener('keydown',tecla); d.classList.remove('on'); setTimeout(function(){d.remove()},150); res(v); };
    var tecla=function(e){ if(e.key==='Escape') cerrar(false); };
    d.addEventListener('click',function(e){ if(e.target===d) return cerrar(false); var r=e.target.getAttribute&&e.target.getAttribute('data-r'); if(r!=null) cerrar(r==='1'); });
    document.addEventListener('keydown',tecla);
    document.body.appendChild(d); requestAnimationFrame(function(){ d.classList.add('on'); d.querySelector('[data-r="1"]').focus(); });
  });
}
function guardarResp(el){
  if(S._editando) return;   // editando respuestas ya enviadas: se guarda todo junto con "Mandar cambios"
  var v=el.value, k=el.getAttribute('data-q'), a=S.datos.alta; a.respuestas=a.respuestas||{};
  if((a.respuestas[k]||'')===v) return; a.respuestas[k]=v; var o={}; o[k]=v;
  post({accion:'alta_guardar',respuestas:o}).then(function(r){ if(r.ok) toast('Guardado'); });
}
function enviarAlta(b){
  var a=S.datos.alta, qs=(a.preguntas&&a.preguntas.length)?a.preguntas:PREGUNTAS_BASE, todo={};
  qs.forEach(function(q){var el=$('q_'+q.id); if(el) todo[q.id]=el.value});
  var oblig=qs.filter(function(q){return !q.opcional}), falta=oblig.filter(function(q){return !(todo[q.id]||'').trim()}).length;
  if(falta>Math.floor(oblig.length/2)){ $('altaErr').textContent='Respondé al menos la mitad de las preguntas (te faltan '+falta+'). Lo demás lo vemos después.'; return; }
  b.disabled=true; post({accion:'alta_enviar',respuestas:todo}).then(function(r){ if(r.ok){a.respuestas=todo;a.enviado=true;toast(S._editando?'Cambios enviados ✓':'¡Gracias!');S._editando=false;vAlta()} else {b.disabled=false;toast('No se pudo enviar')} });
}
